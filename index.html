<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTQL PRODUCTION</title>
    <!-- Memanggil Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-[#070d1a] via-[#0b1325] to-[#020408] min-h-screen flex justify-center items-center py-6 px-4 text-slate-800">

    <!-- Container Aplikasi -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden relative border border-amber-500/20">
        
        <!-- Bagian Header dengan Banner Baru (Garis putih otomatis di-crop bersih) -->
        <header class="relative shadow-md overflow-hidden bg-slate-900">
            <div class="overflow-hidden w-full h-40 sm:h-48 relative">
                <img src="banner.jpg" alt="MTQL Production Banner" class="w-full h-full object-cover scale-[1.06] block">
            </div>
        </header>

        <!-- Bagian Isi / Formulir Pemesanan -->
          <main class="p-6 space-y-5 bg-gradient-to-b from-white to-amber-50/20">
            <div class="bg-amber-50 p-4 rounded-2xl border border-amber-200 flex items-start gap-3 shadow-sm">
                <span class="text-amber-600 text-lg font-bold">✨</span>
                <p class="text-xs text-amber-900 leading-relaxed font-medium">Silakan isi formulir di bawah ini dengan lengkap untuk terhubung langsung dengan tim kami.</p>
            </div>

              <form id="formPemesanan" class="space-y-4">
                
                <!-- Input Nama -->
                <div>
                    <label for="nama" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Nama Lengkap</label>
                    <input type="text" id="nama" required placeholder="Contoh: Budi Santoso" 
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm focus:bg-white focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition-all shadow-sm">
                </div>

                <!-- NAMA MAJELIS -->
                <div>
                    <label for="namaMajelis" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">nama perorangan/majelis ta'lim</label>
                    <textarea id="namaMajelis" rows="3" required placeholder="Isi Strip (-) Jika Perorangan" 
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm focus:bg-white focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition-all shadow-sm resize-none"></textarea>
                </div>

                <!-- Jumlah / Pilihan eks -->
                <div>
                    <label for="jumlah" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Jumlah Pesanan (Eks)</label>
                    <input type="number" id="jumlah" min="1" required placeholder="Masukkan jumlah (Contoh: 25)" 
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm focus:bg-white focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition-all shadow-sm">
                    
                    <!-- Informasi Ketentuan & Total Harga Otomatis -->
                    <div class="mt-2 p-3 bg-amber-50/60 rounded-xl border border-amber-200/80 text-xs text-slate-700 space-y-1">
                        <p class="font-semibold text-amber-900">📋 Ketentuan Harga Grosir:</p>
                        <p>• 1 - 20 eks: Rp 35.000 / eks</p>
                        <p>• 21 - 100 eks: Rp 33.000 / eks</p>
                        <p>• 100 - 200 eks: Rp 30.000 / eks</p>
                        <p class="font-bold text-amber-700 pt-1" id="infoTotal">Total Harga: Rp 0</p>
                    </div>

                    <!-- Input tersembunyi untuk menyimpan nilai total harga -->
                    <input type="hidden" id="harga" value="0">
                </div>

                <!-- Alamat Lengkap -->
                <div>
                    <label for="alamat" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Alamat Lengkap</label>
                    <textarea id="alamat" rows="3" required placeholder="Contoh: Jl. Sudirman No. 10, RT 01/02..." 
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm focus:bg-white focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition-all shadow-sm resize-none"></textarea>
                </div>

                <!-- Tombol Pesan (Nuansa Gold / Amber Mewah Selaras Logo) -->
                <button type="submit" id="btnSubmit" class="w-full bg-gradient-to-r from-amber-400 via-amber-500 to-amber-600 hover:from-amber-500 hover:to-amber-700 text-slate-950 font-extrabold text-sm py-4 rounded-xl shadow-lg shadow-amber-500/30 transition-all duration-300 mt-2 flex justify-center items-center gap-2 active:scale-[0.98]">
                    <span>📱</span> Pesan Via WhatsApp
                </button>
            </form>
        </main>
    </div>

    <!-- Script JavaScript -->
    <script>
        const URL_DATABASE = 'https://script.google.com/macros/s/AKfycbwGKjwO-WAmyb_K9_trSMUFga10cAV38BA3qYyCk9vOOrWdfC566thyvDOMFcROGNWHlw/exec';

        const inputJumlah = document.getElementById('jumlah');
        const hiddenHarga = document.getElementById('harga');
        const infoTotal = document.getElementById('infoTotal');

        inputJumlah.addEventListener('input', function() {
            let qty = parseInt(this.value) || 0;
            let hargaSatuan = 0;

            if (qty > 0 && qty <= 20) {
                hargaSatuan = 35000;
            } else if (qty >= 21 && qty <= 100) {
                hargaSatuan = 33000;
            } else if (qty > 100) {
                hargaSatuan = 30000;
            }

            let totalHarga = qty * hargaSatuan;
            hiddenHarga.value = totalHarga;
            infoTotal.innerText = `Total Harga: Rp ${totalHarga.toLocaleString('id-ID')}`;
        });

        document.getElementById('formPemesanan').addEventListener('submit', function(e) {
            e.preventDefault();

            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.disabled = true;
            btnSubmit.innerText = 'Menghubungkan ke WhatsApp...';

            const nama = document.getElementById('nama').value;
            const namaMajelis = document.getElementById('namaMajelis').value;
            const jumlaheks = document.getElementById('jumlah').value + ' Eks';
            const alamat = document.getElementById('alamat').value;
            const harga = document.getElementById('harga').value || '0';

            const dataPesanan = { 
                nama: nama, 
                majelis: namaMajelis, 
                order: jumlaheks, 
                alamat: alamat, 
                harga: harga 
            };

            fetch(URL_DATABASE, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dataPesanan)
            }).catch(err => console.error('Gagal simpan database:', err));

            const nomorAdmin = '6282111212263'; 
            const pesan = `Halo *MTQL Production*, saya ingin memesan produk. Berikut data saya:\n\n` +
                          `Nama: ${nama}\n` +
                          `Nama Majelis: ${namaMajelis}\n` +
                          `Jumlah Pesanan: ${jumlaheks}\n` +
                          `Alamat: ${alamat}\n` +
                          `Total Harga: Rp ${Number(harga).toLocaleString('id-ID')}\n\n` +
                          `Mohon segera diproses, terima kasih!`;

            const urlWhatsApp = `https://wa.me/${nomorAdmin}?text=${encodeURIComponent(pesan)}`;
            
            window.location.href = urlWhatsApp;
            
            setTimeout(() => {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<span>📱</span> Pesan Via WhatsApp';
                document.getElementById('formPemesanan').reset();
                infoTotal.innerText = 'Total Harga: Rp 0';
            }, 2000);
        });
    </script>
</body>
</html>
